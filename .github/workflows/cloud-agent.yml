name: Cloud Agent
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'owner/repo (để trống = dùng repo hiện tại; nếu chưa tồn tại sẽ tự tạo)'
        required: false
      base_url:
        description: 'ANTHROPIC_BASE_URL'
        required: true
      model:
        description: 'ANTHROPIC_MODEL'
        required: true
      api_key:
        description: '⚠️ ANTHROPIC_AUTH_TOKEN — để trống sẽ dùng secret có sẵn (AN TOÀN HƠN). Nếu gõ vào và repo PUBLIC, key sẽ lộ trong lịch sử run.'
        required: false
      context_window:
        description: 'Context window thật của model (số token, ví dụ 128000). Để trống = không set, dùng mặc định của Claude Code.'
        required: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Xác định repo mục tiêu
        id: target
        run: |
          REPO="${{ inputs.repo }}"
          if [ -z "$REPO" ]; then REPO="${{ github.repository }}"; fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Xác định API key + cảnh báo nếu dùng trigger input
        id: resolve_key
        run: |
          if [ -n "${{ inputs.api_key }}" ]; then
            echo "::warning::Bạn đang dùng API key nhập trực tiếp qua trigger input. Nếu repo PUBLIC, key này sẽ hiển thị lại trong lịch sử run cho bất kỳ ai xem. Khuyến nghị dùng secret ANTHROPIC_AUTH_TOKEN thay thế."
            echo "::add-mask::${{ inputs.api_key }}"
            echo "key=${{ inputs.api_key }}" >> "$GITHUB_OUTPUT"
          else
            echo "key=${{ secrets.ANTHROPIC_AUTH_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tạo repo nếu chưa tồn tại (có README để có sẵn branch main)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh repo view "${{ steps.target.outputs.repo }}" >/dev/null 2>&1 || \
          gh repo create "${{ steps.target.outputs.repo }}" --private --add-readme

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repo }}
          token: ${{ secrets.GH_PAT }}

      - name: Cài Claude Code + ttyd + tmux + cloudflared
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          sudo apt-get update && sudo apt-get install -y ttyd tmux
          # apt cài ttyd kèm 1 systemd service tự bật sẵn, chiếm cổng 7681 -> phải tắt trước khi tự chạy tay
          sudo systemctl stop ttyd || true
          sudo systemctl disable ttyd || true
          # QUAN TRỌNG: tải ra NGOÀI thư mục repo (workspace), nếu không file binary này
          # sẽ bị "git add -A" ở bước auto-save gom nhầm vào repo, che mất source thật
          # mà agent tạo ra.
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Set context window cho model (nếu có nhập)
        if: ${{ inputs.context_window != '' }}
        env:
          CW_MODEL: ${{ inputs.model }}
          CW_VALUE: ${{ inputs.context_window }}
        run: |
          mkdir -p ~/.claude
          cat > /tmp/set_context_window.py <<'PY'
          import json, os

          path = os.path.expanduser("~/.claude/settings.json")
          model = os.environ["CW_MODEL"]
          value = int(os.environ["CW_VALUE"])

          data = {}
          if os.path.exists(path):
              try:
                  with open(path) as f:
                      data = json.load(f)
              except Exception:
                  data = {}

          data.setdefault("modelOverrides", {})
          data["modelOverrides"][model] = {"contextWindow": value}

          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          PY
          # Ghi modelOverrides để Claude Code biết đúng context window thật của model,
          # tránh mặc định đoán 200k khi model không nằm trong danh sách nhận diện sẵn.
          python3 /tmp/set_context_window.py
          cat ~/.claude/settings.json

      - name: Auto-save nền (real-time, theo thay đổi file)
        run: |
          sudo apt-get install -y inotify-tools
          git config user.email "bot@ci"
          git config user.name "cloud-agent"

          # Baseline commit: chốt lại trạng thái sạch (sau khi cài Claude Code/ttyd,
          # cloudflared đã KHÔNG còn nằm trong thư mục này) trước khi agent bắt đầu
          # code, để mọi commit autosave sau đó chỉ chứa thay đổi thật của agent.
          git add -A && git commit -m "baseline before agent" || true
          git push || true

          cat > /tmp/autosave.sh <<'SH'
          #!/bin/bash
          cd "$GITHUB_WORKSPACE"
          while true; do
            inotifywait -r -e modify,create,delete,move --exclude '^\./\.git' -q .
            while inotifywait -r -e modify,create,delete,move --exclude '^\./\.git' -q -t 5 .; do :; done
            git add -A && git commit -m "autosave $(date -u +%FT%TZ)" || true
            git push || true
          done
          SH
          chmod +x /tmp/autosave.sh

          # setsid + nohup + disown: tách hẳn tiến trình khỏi process group của step này,
          # để runner không dọn nó khi step kết thúc và chuyển sang step tiếp theo.
          setsid nohup /tmp/autosave.sh > /tmp/autosave.log 2>&1 < /dev/null &
          disown

      - name: Mở terminal + tunnel
        env:
          ANTHROPIC_BASE_URL: ${{ inputs.base_url }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.resolve_key.outputs.key }}
          ANTHROPIC_MODEL: ${{ inputs.model }}
          # Nếu không nhập context_window, tắt cảnh báo/enforcement thay vì để Claude Code
          # tự đoán 200k cho model lạ (đỡ risk auto-compact sai thời điểm).
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: ${{ inputs.context_window == '' && '1' || '' }}
        run: |
          # -W: cho phép ghi (nhập liệu) qua web
          # tmux new-session -A -s main: nếu session "main" đã tồn tại (do reload trang) thì
          # attach lại vào đúng session cũ thay vì tạo shell mới -> không mất tiến trình claude
          # đang chạy khi reload/mất kết nối web.
          ttyd -p 7681 -W tmux new-session -A -s main &
          cloudflared tunnel --url http://localhost:7681

      - name: Lưu chốt cuối cùng
        if: always()
        run: |
          echo "----- autosave.log -----"
          cat /tmp/autosave.log || true
          echo "-------------------------"
          git add -A && git commit -m "final save" || true
          git push || true
          git log --oneline -n 20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-code
          path: .
